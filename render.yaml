services:
  - type: web
    name: trinetra-c2-border-sentry
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENCV_FFMPEG_CAPTURE_OPTIONS
        value: "rtsp_transport;tcp|fflags;nobuffer|max_delay;0"
    healthCheckPath: /api/telemetry
    autoDeploy: true
